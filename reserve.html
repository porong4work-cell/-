<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>예약</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .page-header {
      background: #fff;
      padding: 20px 24px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h2 { font-size: 20px; font-weight: 500; }
    .home-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .content { padding: 20px 24px; }

    .card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #ddd;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 6px;
    }
    .machine-name {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .remain-time {
      font-size: 14px;
      color: #3182ce;
      margin-bottom: 20px;
    }

    /* ── 스텝 인디케이터 ── */
    .step-indicator {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 18px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #bbb;
      transition: color 0.2s;
    }
    .step.active { color: #3182ce; font-weight: 500; }
    .step.done   { color: #111; }
    .step-num {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 1.5px solid #ddd;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 600;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .step.active .step-num {
      border-color: #3182ce;
      background: #3182ce;
      color: #fff;
    }
    .step.done .step-num {
      border-color: #111;
      background: #111;
      color: #fff;
    }
    .step-arrow {
      font-size: 12px;
      color: #ccc;
      margin: 0 8px;
    }

    /* ── 선택된 시간 표시 배지 ── */
    .selected-display {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #f0f7ff;
      border-radius: 8px;
      margin-bottom: 16px;
      min-height: 40px;
    }
    .selected-display .label {
      font-size: 12px;
      color: #888;
      flex-shrink: 0;
    }
    .selected-display .value {
      font-size: 14px;
      font-weight: 500;
      color: #3182ce;
    }
    .selected-display .reset-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      color: #aaa;
      font-size: 13px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .selected-display .reset-btn:active { background: #e2ecf8; }

    /* ── 공통 그리드 ── */
    .time-grid {
      display: grid;
      gap: 8px;
    }

    /* 1단계: 시간(Hour) — 4열 */
    .time-grid.step1 {
      grid-template-columns: repeat(4, 1fr);
    }

    /* 2단계: 분(Minute) — 3열 */
    .time-grid.step2 {
      grid-template-columns: repeat(3, 1fr);
    }

    .time-slot {
      padding: 12px 4px;
      border-radius: 8px;
      border: 1.5px solid #ddd;
      text-align: center;
      font-size: 14px;
      cursor: pointer;
      color: #111;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .time-slot:not(.booked):not(.selected):active {
      background: #f0f0f0;
      transform: scale(0.97);
    }
    .time-slot.booked {
      color: #ccc;
      border-color: #eee;
      background: #fafafa;
      cursor: not-allowed;
    }
    .time-slot.selected {
      background: rgba(49, 130, 206, 0.12);
      border-color: #3182ce;
      color: #3182ce;
      font-weight: 600;
    }
    /* 분 버튼은 크게 */
    .time-grid.step2 .time-slot {
      padding: 16px 4px;
      font-size: 15px;
    }

    /* 뒤로 가기 버튼 */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      color: #3182ce;
      font-size: 13px;
      padding: 0;
      margin-bottom: 14px;
    }
    .back-btn:active { opacity: 0.6; }

    /* 슬라이드 애니메이션 */
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideBack {
      from { opacity: 0; transform: translateX(-18px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .slide-in   { animation: slideIn  0.22s ease; }
    .slide-back { animation: slideBack 0.22s ease; }

    /* ── 예약 버튼 ── */
    .reserve-btn {
      width: 100%;
      padding: 14px;
      background: #fff;
      border: 1.5px solid #111;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    .reserve-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .reserve-btn:not(:disabled):active { background: #f0f0f0; }

    /* ── 모달 ── */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px 24px;
      width: 85%;
      text-align: center;
    }
    .modal h3 { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
    .modal p  { font-size: 14px; color: #555; margin-bottom: 24px; line-height: 1.6; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid #111;
      border-radius: 8px;
      background: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    .modal-btn.confirm { background: #111; color: #fff; }
    .modal-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="page-header">
    <h2>예약하기</h2>
    <button class="home-btn" onclick="location.href='index.html'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H15v-5h-6v5H4a1 1 0 0 1-1-1V9.5z"/>
      </svg>
    </button>
  </div>

  <div class="content">
    <div class="card">
      <div class="card-label">예약하기</div>
      <div class="machine-name" id="machine-name">-</div>
      <div class="remain-time"  id="remain-time"></div>

      <!-- 스텝 인디케이터 -->
      <div class="step-indicator">
        <div class="step active" id="step1-indicator">
          <div class="step-num">1</div>
          <span>시간 선택</span>
        </div>
        <span class="step-arrow">›</span>
        <div class="step" id="step2-indicator">
          <div class="step-num">2</div>
          <span>분 선택</span>
        </div>
      </div>

      <!-- 선택 현황 표시 -->
      <div class="selected-display" id="selected-display">
        <span class="label">선택된 시간</span>
        <span class="value" id="selected-value">-</span>
        <button class="reset-btn" id="reset-btn" onclick="resetAll()" style="display:none">✕ 초기화</button>
      </div>

      <!-- 그리드 컨테이너 -->
      <div id="grid-container">
        <!-- JS로 렌더링 -->
      </div>
    </div>

    <button class="reserve-btn" id="reserve-btn" disabled onclick="openModal()">예약</button>
  </div>

  <!-- 확인 모달 -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>예약 완료</h3>
      <p id="modal-msg"></p>
      <div class="modal-btns">
        <button class="modal-btn"         onclick="closeModal()">취소</button>
        <button class="modal-btn confirm" onclick="confirmReserve()">확인</button>
      </div>
    </div>
  </div>

  <script>
    /* ── URL 파라미터 ── */
    const params      = new URLSearchParams(location.search);
    const machineName = params.get('name')   || '알 수 없는 기기';
    const remainMin   = params.get('remain');
    const machineType = params.get('type')   || 'washer';

    document.getElementById('machine-name').textContent = machineName;
    document.getElementById('remain-time').textContent  = remainMin
      ? '예상 잔여 시간: ' + remainMin + '분'
      : '예상 잔여 시간: -';

    /* ── 예약된 슬롯 (서버 연결 전 임시) ── */
    const bookedSlots = new Set(['10:40', '11:30', '13:10']);

    /* ── 상태 ── */
    let currentStep   = 1;   // 1 = 시간 선택, 2 = 분 선택
    let selectedHour  = null; // "09", "10", ...
    let selectedMinute = null; // "00", "10", ...

    /* ── 시간(Hour) 목록: 09~20 ── */
    const hours = [];
    for (let h = 9; h <= 20; h++) hours.push(String(h).padStart(2, '0'));

    /* ── 분(Minute) 목록: 10분 간격 ── */
    const minutes = ['00','10','20','30','40','50'];

    /* ── 특정 시간에 예약 가능한 분이 하나라도 있는지 확인 ── */
    function hasAvailableMinute(hour) {
      return minutes.some(m => !bookedSlots.has(hour + ':' + m));
    }

    /* ── 스텝 인디케이터 업데이트 ── */
    function updateStepIndicator() {
      const s1 = document.getElementById('step1-indicator');
      const s2 = document.getElementById('step2-indicator');
      if (currentStep === 1) {
        s1.className = 'step active';
        s2.className = 'step';
      } else {
        s1.className = 'step done';
        s2.className = 'step active';
      }
    }

    /* ── 선택 현황 업데이트 ── */
    function updateDisplay() {
      const val  = document.getElementById('selected-value');
      const rBtn = document.getElementById('reset-btn');
      if (selectedHour && selectedMinute) {
        val.textContent  = selectedHour + ':' + selectedMinute;
        rBtn.style.display = '';
      } else if (selectedHour) {
        val.textContent  = selectedHour + '시 선택됨 →';
        rBtn.style.display = '';
      } else {
        val.textContent  = '-';
        rBtn.style.display = 'none';
      }
    }

    /* ── 1단계: 시간(Hour) 그리드 렌더링 ── */
    function renderStep1(animate) {
      currentStep = 1;
      updateStepIndicator();

      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      const grid = document.createElement('div');
      grid.className = 'time-grid step1 ' + (animate || 'slide-back');

      hours.forEach(h => {
        const allBooked = !hasAvailableMinute(h);
        const isOver20  = (h === '20'); // 20시는 :00만 존재하므로 별도 처리 불필요

        const div = document.createElement('div');
        div.className = 'time-slot' + (allBooked ? ' booked' : '');
        div.textContent = h + ':00';

        if (!allBooked) {
          div.onclick = () => selectHour(h);
        }
        grid.appendChild(div);
      });

      container.appendChild(grid);
      document.getElementById('reserve-btn').disabled = true;
      updateDisplay();
    }

    /* ── 2단계: 분(Minute) 그리드 렌더링 ── */
    function renderStep2(animate) {
      currentStep = 2;
      updateStepIndicator();

      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      // 뒤로 버튼
      const backBtn = document.createElement('button');
      backBtn.className = 'back-btn';
      backBtn.innerHTML = '‹ 시간 다시 선택';
      backBtn.onclick = () => {
        selectedHour   = null;
        selectedMinute = null;
        renderStep1('slide-back');
        document.getElementById('reserve-btn').disabled = true;
      };
      container.appendChild(backBtn);

      const grid = document.createElement('div');
      grid.className = 'time-grid step2 ' + (animate || 'slide-in');

      // 20시는 :00만 허용
      const availableMinutes = selectedHour === '20' ? ['00'] : minutes;

      availableMinutes.forEach(m => {
        const slotKey = selectedHour + ':' + m;
        const isBooked = bookedSlots.has(slotKey);

        const div = document.createElement('div');
        div.className = 'time-slot' + (isBooked ? ' booked' : '');
        div.textContent = selectedHour + ':' + m;

        if (!isBooked) {
          div.onclick = () => selectMinute(m, div);
        }
        grid.appendChild(div);
      });

      container.appendChild(grid);
      updateDisplay();
    }

    /* ── 시간 선택 핸들러 ── */
    function selectHour(h) {
      selectedHour   = h;
      selectedMinute = null;
      renderStep2('slide-in');
    }

    /* ── 분 선택 핸들러 ── */
    function selectMinute(m, el) {
      document.querySelectorAll('.time-slot.selected').forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedMinute = m;
      document.getElementById('reserve-btn').disabled = false;
      updateDisplay();
    }

    /* ── 초기화 ── */
    function resetAll() {
      selectedHour   = null;
      selectedMinute = null;
      renderStep1('slide-back');
      document.getElementById('reserve-btn').disabled = true;
    }

    /* ── 모달 ── */
    function openModal() {
      const slot = selectedHour + ':' + selectedMinute;
      document.getElementById('modal-msg').textContent =
        machineName + ' ' + slot + '에 예약되었습니다.';
      document.getElementById('modal-overlay').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
    }

    function confirmReserve() {
      const isAvailable = (!remainMin || remainMin === 'null' || remainMin === '' || remainMin === '-');
      const status = isAvailable ? 'available' : 'inuse';
      const slot   = selectedHour + ':' + selectedMinute;

      const reservations = JSON.parse(localStorage.getItem('reservations')) || [];
      reservations.push({
        id:     Date.now(),
        name:   machineName,
        type:   machineType,
        slot:   slot,
        status: status,
        remain: remainMin || '-'
      });
      localStorage.setItem('reservations', JSON.stringify(reservations));
      location.href = 'Myusage.html';
    }

    /* ── 초기 렌더링 ── */
    renderStep1('slide-in');
  </script>
</body>
</html>
