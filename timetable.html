<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>식사 불가 시간</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100vh;
    }

    .page-header {
      background: #fff;
      padding: 20px 24px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-header h2 { font-size: 20px; font-weight: 500; }
    .home-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .content { padding: 16px; }

    .desc {
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    /* 범례 */
    .legend {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      margin-bottom: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #555;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 20px;
      padding: 4px 8px;
      white-space: nowrap;
    }
    .legend-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* 일괄 선택 섹션 */
    .bulk-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #ddd;
      margin-bottom: 14px;
      padding: 11px 16px;
    }
    .bulk-title {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .bulk-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bulk-label { display: none; }
    .bulk-btn-group {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      flex: 1;
    }
    .bulk-btn {
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      border: 1.5px solid #ddd;
      background: #f5f5f5;
      color: #555;
      white-space: nowrap;
      transition: background 0.13s, color 0.13s, border-color 0.13s;
    }
    .bulk-btn:active { opacity: 0.75; }
    .bulk-btn.active-breakfast { background: #FFF3E0; border-color: #EF9F27; color: #7B4200; font-weight: 500; }
    .bulk-btn.active-lunch     { background: #E8F5E9; border-color: #2E7D32; color: #1B5E20; font-weight: 500; }
    .bulk-btn.active-dinner    { background: #EDE7F6; border-color: #6A1B9A; color: #4A148C; font-weight: 500; }
    .bulk-btn.active-dinner    { background: #EDE7F6; border-color: #6A1B9A; color: #4A148C; font-weight: 500; }

    /* 구분선 */
    .divider {
      height: 1px;
      background: #eee;
      margin: 0 0 14px;
    }

    /* 요일 카드 */
    .day-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #ddd;
      margin-bottom: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .day-label {
      font-size: 15px;
      font-weight: 500;
      color: #111;
      width: 24px;
      flex-shrink: 0;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      flex: 1;
    }
    .meal-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 20px;
      font-size: 13px;
      text-align: center;
      font-family: inherit;
      cursor: pointer;
      border: 1.5px solid #ddd;
      background: #fff;
      color: #888;
      transition: background 0.13s, color 0.13s, border-color 0.13s;
    }
    .meal-btn.on-breakfast { background: #FFF3E0; border-color: #EF9F27; color: #7B4200; font-weight: 500; }
    .meal-btn.on-lunch     { background: #E8F5E9; border-color: #2E7D32; color: #1B5E20; font-weight: 500; }
    .meal-btn.on-dinner    { background: #EDE7F6; border-color: #6A1B9A; color: #4A148C; font-weight: 500; }

    /* 저장 버튼 */
    .save-wrap { padding: 8px 0 24px; }
    .save-btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #111;
      border: none;
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
    }
    .save-btn:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="page-header">
    <h2>식사 불가 시간</h2>
    <button class="home-btn" onclick="location.href='index.html'">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H15v-5h-6v5H4a1 1 0 0 1-1-1V9.5z"/>
      </svg>
    </button>
  </div>

  <div class="content">
    <p class="desc">강의나 일정으로 식사가 불가한 시간대를 요일별로 선택해주세요. 중복 선택 가능해요.</p>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#EF9F27;"></div>
        아침 07:30–09:00
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#2E7D32;"></div>
        점심 11:30–13:30
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#6A1B9A;"></div>
        저녁 17:30–19:30
      </div>
    </div>

    <!-- 일괄 선택 -->
    <div class="bulk-card">
      <div class="bulk-row">
        <p class="bulk-title">전체 요일 일괄 선택</p>
        <div class="bulk-btn-group">
          <button class="bulk-btn" id="bulk-breakfast" onclick="toggleBulk('breakfast')">아침</button>
          <button class="bulk-btn" id="bulk-lunch"     onclick="toggleBulk('lunch')">점심</button>
          <button class="bulk-btn" id="bulk-dinner"    onclick="toggleBulk('dinner')">저녁</button>
        </div>
      </div>
    </div>

    <div id="day-rows"></div>

    <div class="save-wrap">
      <button class="save-btn" onclick="doSave()">저장하기</button>
    </div>
  </div>

  <script>
    const DAYS = ['월','화','수','목','금'];
    const MEALS = [
      { key: 'breakfast', label: '아침', cls: 'on-breakfast' },
      { key: 'lunch',     label: '점심', cls: 'on-lunch'     },
      { key: 'dinner',    label: '저녁', cls: 'on-dinner'    },
    ];
    const MEAL_TIMES = {
      breakfast: '아침 (07:30–09:00)',
      lunch:     '점심 (11:30–13:30)',
      dinner:    '저녁 (17:30–19:30)',
    };

    const STORAGE_KEY = 'meal_unavail_bulk_v1';
    const state = {};
    DAYS.forEach(d => { state[d] = new Set(); });

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const obj = JSON.parse(saved);
          DAYS.forEach(d => { state[d] = new Set(obj[d] || []); });
        }
      } catch (e) {}
    }

    function saveState() {
      const obj = {};
      DAYS.forEach(d => { obj[d] = [...state[d]]; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(obj));
    }

    // 일괄 선택: 전체 요일에 해당 식사 토글
    function toggleBulk(mealKey) {
      // 모든 요일에 선택된 상태면 → 전체 해제, 아니면 → 전체 선택
      const allOn = DAYS.every(d => state[d].has(mealKey));
      DAYS.forEach(d => {
        if (allOn) state[d].delete(mealKey);
        else state[d].add(mealKey);
      });
      saveState();
      render();
      updateBulkBtns();
    }

    // 일괄 버튼 상태 갱신: 전체 요일이 선택된 경우 활성 표시
    function updateBulkBtns() {
      MEALS.forEach(m => {
        const btn = document.getElementById('bulk-' + m.key);
        const allOn = DAYS.every(d => state[d].has(m.key));
        btn.className = 'bulk-btn' + (allOn ? ' active-' + m.key : '');
      });
    }

    function render() {
      const container = document.getElementById('day-rows');
      container.innerHTML = '';
      DAYS.forEach(d => {
        const card = document.createElement('div');
        card.className = 'day-card';

        const label = document.createElement('span');
        label.className = 'day-label';
        label.textContent = d;
        card.appendChild(label);

        const group = document.createElement('div');
        group.className = 'btn-group';

        MEALS.forEach(m => {
          const btn = document.createElement('button');
          const on = state[d].has(m.key);
          btn.className = 'meal-btn' + (on ? ' ' + m.cls : '');
          btn.textContent = m.label;
          btn.setAttribute('aria-pressed', on ? 'true' : 'false');
          btn.onclick = () => {
            if (state[d].has(m.key)) state[d].delete(m.key);
            else state[d].add(m.key);
            saveState();
            render();
            updateBulkBtns();
          };
          group.appendChild(btn);
        });

        card.appendChild(group);
        container.appendChild(card);
      });
    }

    function doSave() {
      const summary = DAYS.map(d => {
        const sel = [...state[d]].map(k => MEAL_TIMES[k]);
        return sel.length ? `${d}요일: ${sel.join(', ')}` : null;
      }).filter(Boolean);

      if (!summary.length) {
        alert('식사 불가 시간대를 하나 이상 선택해주세요.');
        return;
      }
      saveState();
      alert('저장되었습니다!\n\n식사 불가 시간대:\n' + summary.join('\n'));
    }

    loadState();
    render();
    updateBulkBtns();
  </script>
</body>
</html>
